name: Test arccos-api formula

on:
  pull_request:
    paths:
      - Formula/arccos-api.rb
      - .github/workflows/arccos-api.yml
  push:
    branches: [main]
    paths:
      - Formula/arccos-api.rb
      - .github/workflows/arccos-api.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Prepare tap checkout
        run: |
          brew tap pfrederiksen/tap
          cp Formula/arccos-api.rb "$(brew --repo pfrederiksen/tap)/Formula/arccos-api.rb"
      - name: Audit formula
        run: brew audit --strict --online pfrederiksen/tap/arccos-api
      - name: Install formula
        run: brew install pfrederiksen/tap/arccos-api
      - name: Test formula
        run: brew test pfrederiksen/tap/arccos-api
      - name: Verify CLI
        run: arccos --version | grep '0.5.2'
